#
# LibreLane configuration for hardening chip_top. Seeded from
# librelane/config.yaml in the gf180mcu project template (Apache-2.0, (c) 2025
# Project Template Contributors) and diffed against it, per the map's Notes:
# the template's defaults encode Run 1 and Run 2 experience, so a setting that
# differs from it below carries a reason.
#
# `make harden` passes four files, in this order:
#
#   flow/slot_1x1.yaml        die and core geometry, pad ring order
#   flow/macros.yaml          macro views and placement
#   flow/build/sources.yaml   the file list, generated by flow/synth/sources.sh
#   flow/config.yaml          this file
#
# The order matters twice over. Later files win on any key they both set, and
# LibreLane resolves `dir::` against the directory of the *last* file on the
# command line, which is why every one of these lives directly in flow/.

meta:
  version: 3
  flow: Chip
  substituting_steps:

    # Verilator cannot read this design. Upstream's RTL is SystemVerilog with
    # interfaces, packages and packed structs across more than fifty files, and
    # ticket 03 settled the front end on yosys-slang for exactly that reason.
    # Linting with a front end that cannot elaborate the design would report its
    # own limitations, not the design's.
    Verilator.Lint: null
    Checker.LintTimingConstructs: null
    Checker.LintErrors: null
    Checker.LintWarnings: null

    # Render the layout after sealring insertion
    KLayout.Render: null
    +KLayout.SealRing: KLayout.Render

DESIGN_NAME: chip_top

# VERILOG_FILES and VERILOG_INCLUDE_DIRS come from flow/build/sources.yaml,
# which flow/synth/sources.sh regenerates from fusesoc on every `make harden`.
# Nothing here should set them; the file list has exactly one source of truth.

# Ticket 03: yosys-slang reads the whole SoC. `--keep-hierarchy` is slang's own
# flag and is unrelated to SYNTH_HIERARCHY_MODE, which stays at its "flatten"
# default because flow/README.md's "Synthesis must flatten" section makes
# flattening worth 1.30 mm2 of cell area rather than a preference.
USE_SLANG: True
SLANG_ARGUMENTS: ['--keep-hierarchy']

# `SYNTHESIS` only disables assertion blocks here. `PULP_FPGA_EMUL` is
# deliberately absent: leaving it undefined is what selects the ASIC branches in
# soc_domain.sv and safe_domain.sv.
VERILOG_DEFINES: ["SYNTHESIS"]

# `dfflibmap` maps flip-flops only, and upstream's apb_soc_ctrl infers two
# latches (`reset_reason[1:0]`; ticket 06's `bootsel` removal took the other two
# with it). The PDK ships the map for this library and points SYNTH_LATCH_MAP at
# it, but LibreLane's gf180mcu compatibility shim deletes that key from the PDK
# configuration on the way in (config/pdk_compat.py), so without this line the
# netlist carries two unmapped `$_DLATCH_P_` cells and the Unmapped Cells
# Checker stops the flow after synthesis.
SYNTH_LATCH_MAP: pdk_dir::libs.tech/librelane/gf180mcu_fd_sc_mcu7t5v0/latch_map.v

# Slightly smaller file sizes
PRIMARY_GDSII_STREAMOUT_TOOL: klayout

# SDC files
PNR_SDC_FILE: dir::chip_top.sdc
SIGNOFF_SDC_FILE: dir::chip_top.sdc
FALLBACK_SDC: dir::chip_top.sdc

# Power / ground nets. One core rail at 3.3 V (tickets 14, 21); the 5.0 V ring
# is the pads' own DVDD/DVSS and never reaches the core grid.
VDD_NETS:
- VDD
GND_NETS:
- VSS

# --- 3.3 V core corner ------------------------------------------------------
#
# The PDK's own libs.tech/librelane/config.tcl defaults to 5.0 V, and ticket 14
# settled the core at 3.3 V. Three settings have to move together and nothing
# warns you if one is missed. The library does not change: gf180mcu_fd_sc_mcu7t5v0
# carries all 229 cells at every one of its fifteen corners with identical
# geometry, so the `5v0` is the oxide and this costs no area.
#
# Three, not the four flow/README.md used to list: `VDD_PIN_VOLTAGE` is a
# *removed* variable in LibreLane 3.1 ("Information should be obtained from
# dotlib files", config/removals.py), and setting it here was accepted and
# silently discarded, never reaching resolved.json. The supply now follows from
# which liberty files CELL_LIBS names, which is what the three below decide.
#
# The library name is written out rather than taken from `--scl`, because ticket
# 16 made the SCL override non-functional anyway: rtl/gf180mcu/gf180_clk_gate.sv
# instantiates three cells from this library by name.
CELL_LIBS:
  "*_tt_025C_3v30":
  - pdk_dir::libs.ref/gf180mcu_fd_sc_mcu7t5v0/lib/gf180mcu_fd_sc_mcu7t5v0__tt_025C_3v30.lib
  "*_ff_n40C_3v60":
  - pdk_dir::libs.ref/gf180mcu_fd_sc_mcu7t5v0/lib/gf180mcu_fd_sc_mcu7t5v0__ff_n40C_3v60.lib
  "*_ss_125C_3v00":
  - pdk_dir::libs.ref/gf180mcu_fd_sc_mcu7t5v0/lib/gf180mcu_fd_sc_mcu7t5v0__ss_125C_3v00.lib

STA_CORNERS:
- nom_tt_025C_3v30
- nom_ss_125C_3v00
- nom_ff_n40C_3v60
- min_tt_025C_3v30
- min_ss_125C_3v00
- min_ff_n40C_3v60
- max_tt_025C_3v30
- max_ss_125C_3v00
- max_ff_n40C_3v60

DEFAULT_CORNER: nom_tt_025C_3v30

# The pad ring is not this rail. Ticket 18 put 5.0 V over the 3.3 V core with
# the level shifter inside each `gf180mcu_ocd_io` pad cell, but the PDK's pad
# configuration maps these 3.3 V corner names onto the pad library's 3v30/3v63/
# 2v97 files, so the pads are characterised at the core supply rather than at
# the 5.0 V they will run at. That is pessimistic on the output driver and is
# left that way on purpose.

# --- Clock ------------------------------------------------------------------
#
# 100 ns is ticket 05's settled 10 MHz. The clock is defined on the pad cell's
# core-side output rather than the bond pad. The JTAG clock and the /40 divided
# clock are declared in flow/chip_top.sdc, which this cannot express.
CLOCK_PORT: clk_PAD
CLOCK_NET: clk_pad/Y
CLOCK_PERIOD: 100

# --- Placement and routing --------------------------------------------------

# Overfix hold violations. Left at the template's values deliberately: 180 nm
# hold fixing is cheap and a hold failure is not repairable after fabrication.
PL_RESIZER_HOLD_SLACK_MARGIN: 0.35
GRT_RESIZER_HOLD_SLACK_MARGIN: 0.3

# Run 1 designs achieved 3k to 14k cells/mm2 against a much higher theoretical
# maximum, and ticket 10 flagged 35% as the optimistic end of that experience.
# There is room: 2.33 mm2 of cells in roughly 10.4 mm2 of placeable core is
# about 22% actual utilisation, so 35% is a ceiling the placer spreads under
# rather than a target it has to reach.
PL_TARGET_DENSITY_PCT: 35
GRT_ALLOW_CONGESTION: true

# Let the legalizer search a long way. The template raises Y from LibreLane's
# default for a design of two SRAMs and a counter; this one arrives at
# `RepairDesignPostGPL` with a 5,773-load clock net, a 4,257-load reset and four
# more nets over 1,500, none of them buffered (flow/README.md's "no buffering at
# all on its highest-fanout nets"). Repairing them inserts about 61,000 buffers
# and grows standard-cell area by a third in one step, which lands on top of a
# global placement that had already spread to the 35% density target. At 500 x
# 200 um the legalizer could not find room for 425 of the new cells and
# `detailed_placement` failed outright (DPL-0036). The core is only 26% full
# before repair, so the space exists; it is further away than the default search
# will look.
PL_MAX_DISPLACEMENT_X: 1000
PL_MAX_DISPLACEMENT_Y: 1000

# Fix antenna violations after DRT
DRT_ANTENNA_REPAIR_ITERS: 10
DRT_ANTENNA_REPAIR_MARGIN: 10 # %

# --- PDN --------------------------------------------------------------------

PDN_CFG: dir::pdn/pdn_cfg.tcl
PDN_ENABLE_PINS: False

# PDN - Straps
PDN_VWIDTH: 5
PDN_HWIDTH: 5
PDN_VSPACING: 1
PDN_HSPACING: 1
PDN_VPITCH: 75
PDN_HPITCH: 75

# PDN - Core ring
PDN_CORE_RING: True
# Maximum metal width without slotting: 30um
PDN_CORE_RING_VWIDTH: 25
PDN_CORE_RING_HWIDTH: 25
PDN_CORE_RING_CONNECT_TO_PADS: True
PDN_CORE_VERTICAL_LAYER: Metal4
PDN_CORE_HORIZONTAL_LAYER: Metal3
PDN_CORE_RING_CONNECT_TO_PAD_LAYERS: [Metal2]

# --- Checks and sign-off ----------------------------------------------------

# The pad cells' Y output is unused wherever a pad is an output only, and the
# marker cells have no ports at all.
IGNORE_DISCONNECTED_MODULES:
- gf180mcu_ocd_io__bi_24t
- gf180mcu_ocd_io__in_c
- gf180mcu_ocd_io__in_s
- gf180mcu_ocd_io__asig_5p0
- gf180mcu_ws_ip__qrcode_id
- gf180mcu_ws_ip__shuttle_id
- gf180mcu_ws_ip__project_id
- gf180mcu_ws_ip__logo
- gf180mcu_ws_ip__marker

# Do not error on magic DRC violations
# Note: Passing magic DRC is not required for the submission.
# However, it is recommended to fix or carefully review all violations.
ERROR_ON_MAGIC_DRC: False

# Prevent false positive DRC errors in I/O cells. This list is the template's,
# written against the foundry SRAM's internals; whatever the OCD macro needs on
# top of it is discovered by running into the false errors, per the map's DRC
# fog patch, and appended here.
MAGIC_GDS_FLATGLOB:
# For contacts
- "*_CDNS_*"
# Foundry provided SRAMs
- "*$$*"
- "M1_N*"
- "M1_P*"
- "M2_M1*"
- "M3_M2*"
- "nmos_5p0*"
- "nmos_1p2*"
- "pmos_5p0*"
- "pmos_1p2*"
- "via1_*"
- "ypass_gate*"
- "G_ring_*"
# These additional cells must be flattened to get rid of 3.3V devices
# (DUALGATE drawn into high-level cells)
- "dcap_103*"
- "din_*"
- "mux821_*"
- "rdummy_*"
- "pmoscap_*"
- "xdec_*"
- "ypredec*"
- "xpredec*"
- "prexdec_*"
- "xdec8_*"
- "xdec16_*"
- "xdec32_*"
- "sa_*"

# Since we cannot meet the minimum density limit on Metal2,
# ignore active metal on previous and subsequent layers
# (DM.5_DM.7 and DM.4_DM.6). Dummy metal is moved to active
# metal during the precheck.
KLAYOUT_FILLER_OPTIONS:
  Metal2_ignore_active: true

# Because we have multiple power pads for one power domain
MAGIC_EXT_UNIQUE: notopports

# Image render settings
KLAYOUT_RENDER_RESOLUTION: 2048
KLAYOUT_RENDER_OVERSAMPLING: 3
KLAYOUT_PROPERTIES: dir::gf180mcu_render.lyp

# DRC settings
# A high number of workers increases RAM usage,
# but can significantly improve the performance.
# workers * threads should equal the available
# hardware threads for a best possible utilization.

KLAYOUT_DRC_THREADS: 1

# "max" equals max hardware threads
KLAYOUT_DRC_OPTIONS:
  decks: "all,-antenna,-density,-cup" # disable CUP for now
  variant: ref::$PDK
  workers: max

KLAYOUT_DENSITY_OPTIONS:
  decks: "density"
  variant: ref::$PDK
  workers: max

KLAYOUT_ANTENNA_OPTIONS:
  decks: "antenna"
  variant: ref::$PDK
  workers: max
