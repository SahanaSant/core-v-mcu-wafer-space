#
# LibreLane configuration for hardening chip_top. Seeded from
# librelane/config.yaml in the gf180mcu project template (Apache-2.0, (c) 2025
# Project Template Contributors) and diffed against it, per the map's Notes:
# the template's defaults encode Run 1 and Run 2 experience, so a setting that
# differs from it below carries a reason.
#
# `make harden` passes four files, in this order:
#
#   flow/slot_1x1.yaml        die and core geometry, pad ring order
#   flow/macros.yaml          macro views and placement
#   flow/build/sources.yaml   the file list, generated by flow/synth/sources.sh
#   flow/config.yaml          this file
#
# The order matters twice over. Later files win on any key they both set, and
# LibreLane resolves `dir::` against the directory of the *last* file on the
# command line, which is why every one of these lives directly in flow/.

meta:
  version: 3
  flow: Chip
  substituting_steps:

    # Verilator cannot read this design. Upstream's RTL is SystemVerilog with
    # interfaces, packages and packed structs across more than fifty files, and
    # ticket 03 settled the front end on yosys-slang for exactly that reason.
    # Linting with a front end that cannot elaborate the design would report its
    # own limitations, not the design's.
    Verilator.Lint: null
    Checker.LintTimingConstructs: null
    Checker.LintErrors: null
    Checker.LintWarnings: null

    # Render the layout after sealring insertion
    KLayout.Render: null
    +KLayout.SealRing: KLayout.Render

DESIGN_NAME: chip_top

# VERILOG_FILES and VERILOG_INCLUDE_DIRS come from flow/build/sources.yaml,
# which flow/synth/sources.sh regenerates from fusesoc on every `make harden`.
# Nothing here should set them; the file list has exactly one source of truth.

# Ticket 03: yosys-slang reads the whole SoC. `--keep-hierarchy` is slang's own
# flag and is unrelated to SYNTH_HIERARCHY_MODE, which stays at its "flatten"
# default because flow/README.md's "Synthesis must flatten" section makes
# flattening worth 1.30 mm2 of cell area rather than a preference.
USE_SLANG: True
SLANG_ARGUMENTS: ['--keep-hierarchy']

# `SYNTHESIS` only disables assertion blocks here. `PULP_FPGA_EMUL` is
# deliberately absent: leaving it undefined is what selects the ASIC branches in
# soc_domain.sv and safe_domain.sv.
VERILOG_DEFINES: ["SYNTHESIS"]

# `dfflibmap` maps flip-flops only, and upstream's apb_soc_ctrl infers two
# latches (`reset_reason[1:0]`; ticket 06's `bootsel` removal took the other two
# with it). The PDK ships the map for this library and points SYNTH_LATCH_MAP at
# it, but LibreLane's gf180mcu compatibility shim deletes that key from the PDK
# configuration on the way in (config/pdk_compat.py), so without this line the
# netlist carries two unmapped `$_DLATCH_P_` cells and the Unmapped Cells
# Checker stops the flow after synthesis.
SYNTH_LATCH_MAP: pdk_dir::libs.tech/librelane/gf180mcu_fd_sc_mcu7t5v0/latch_map.v

# Slightly smaller file sizes
PRIMARY_GDSII_STREAMOUT_TOOL: klayout

# SDC files
PNR_SDC_FILE: dir::chip_top.sdc
SIGNOFF_SDC_FILE: dir::chip_top.sdc
FALLBACK_SDC: dir::chip_top.sdc

# Power / ground nets. One core rail at 3.3 V (tickets 14, 21); the 5.0 V ring
# is the pads' own DVDD/DVSS and never reaches the core grid.
VDD_NETS:
- VDD
GND_NETS:
- VSS

# --- 3.3 V core corner ------------------------------------------------------
#
# The PDK's own libs.tech/librelane/config.tcl defaults to 5.0 V, and ticket 14
# settled the core at 3.3 V. Three settings have to move together and nothing
# warns you if one is missed. The library does not change: gf180mcu_fd_sc_mcu7t5v0
# carries all 229 cells at every one of its fifteen corners with identical
# geometry, so the `5v0` is the oxide and this costs no area.
#
# Three, not the four flow/README.md used to list: `VDD_PIN_VOLTAGE` is a
# *removed* variable in LibreLane 3.1 ("Information should be obtained from
# dotlib files", config/removals.py), and setting it here was accepted and
# silently discarded, never reaching resolved.json. The supply now follows from
# which liberty files CELL_LIBS names, which is what the three below decide.
#
# The library name is written out rather than taken from `--scl`, because ticket
# 16 made the SCL override non-functional anyway: rtl/gf180mcu/gf180_clk_gate.sv
# instantiates three cells from this library by name.
CELL_LIBS:
  "*_tt_025C_3v30":
  - pdk_dir::libs.ref/gf180mcu_fd_sc_mcu7t5v0/lib/gf180mcu_fd_sc_mcu7t5v0__tt_025C_3v30.lib
  "*_ff_n40C_3v60":
  - pdk_dir::libs.ref/gf180mcu_fd_sc_mcu7t5v0/lib/gf180mcu_fd_sc_mcu7t5v0__ff_n40C_3v60.lib
  "*_ss_125C_3v00":
  - pdk_dir::libs.ref/gf180mcu_fd_sc_mcu7t5v0/lib/gf180mcu_fd_sc_mcu7t5v0__ss_125C_3v00.lib

STA_CORNERS:
- nom_tt_025C_3v30
- nom_ss_125C_3v00
- nom_ff_n40C_3v60
- min_tt_025C_3v30
- min_ss_125C_3v00
- min_ff_n40C_3v60
- max_tt_025C_3v30
- max_ss_125C_3v00
- max_ff_n40C_3v60

DEFAULT_CORNER: nom_tt_025C_3v30

# The pad ring is not this rail. Ticket 18 put 5.0 V over the 3.3 V core with
# the level shifter inside each `gf180mcu_ocd_io` pad cell, but the PDK's pad
# configuration maps these 3.3 V corner names onto the pad library's 3v30/3v63/
# 2v97 files, so the pads are characterised at the core supply rather than at
# the 5.0 V they will run at. That is pessimistic on the output driver and is
# left that way on purpose.

# --- Clock ------------------------------------------------------------------
#
# 166.67 ns / 6 MHz, revised by ticket 29 from ticket 05's original 100 ns /
# 10 MHz. Ticket 26's routed design measured a real critical path (the
# CV32E40P decoder's instruction-word fanout) of about 128.6 ns at the slow
# corner, 29% over the 100 ns budget, and OpenROAD's own resizer could not
# repair that with buffering alone ([RSZ-0062] against every one of its
# 6,274 violating endpoints). 166.67 ns puts the real critical path back at
# about 77% utilisation, the same target ticket 24 aimed for pre-layout, and
# it is a standard, easily-sourced crystal frequency, same reasoning ticket 05
# used to land on 10 MHz. The clock is external and was never burned into
# silicon, so this is a budget correction, not a defeat.
#
# This also fixes most of the runtime this design's resizer steps were
# burning: RepairDesignPostGPL and ResizerTimingPostCTS were each spending
# tens of minutes (and inserting ~65,000 buffers) chasing an unreachable 100 ns
# target on every single endpoint before giving up anyway. See ticket 29 for
# the measured before/after.
#
# sw/bootrom/spi.c's PERIPH_CLK_HZ tracks this and needs updating together if
# it changes again. The clock is defined on the pad cell's core-side output
# rather than the bond pad. The JTAG clock and the /40 divided clock are
# declared in flow/chip_top.sdc, which this cannot express.
CLOCK_PORT: clk_PAD
CLOCK_NET: clk_pad/Y
CLOCK_PERIOD: 166.67

# --- Placement and routing --------------------------------------------------

# Overfix hold violations. Left at the template's values deliberately: 180 nm
# hold fixing is cheap and a hold failure is not repairable after fabrication.
PL_RESIZER_HOLD_SLACK_MARGIN: 0.35
GRT_RESIZER_HOLD_SLACK_MARGIN: 0.3

# Run 1 designs achieved 3k to 14k cells/mm2 against a much higher theoretical
# maximum, and ticket 10 flagged 35% as the optimistic end of that experience.
# There is room: 2.33 mm2 of cells in roughly 10.4 mm2 of placeable core is
# about 22% actual utilisation, so 35% is a ceiling the placer spreads under
# rather than a target it has to reach.
PL_TARGET_DENSITY_PCT: 35
GRT_ALLOW_CONGESTION: true

# Ticket 32: keep the delay cells away from the resizer. Every one of
# RepairDesignPostGPL's 16,518 max-fanout repair buffers was a delay cell, one
# whose purpose is adding delay, while wire-length and slew repair picked
# sensible buf/clkbuf sizes. OpenROAD's fanout repair takes the library's
# lowest-drive buffer, and this library puts all four delay families at or
# above buf_1 on drive resistance off the tt_025C_3v30 arcs:
#
#   dlyc_1  13.53 ns/pF   2.284 ns intrinsic   area 54.88
#   dlyd_1  13.53         3.299                     74.64
#   dlyb_1  13.52         1.229                     35.12
#   dlya_1  13.48         0.528                     24.15
#   buf_1   13.48         0.210                     13.17
#
# So a fraction of a percent in drive resistance selects a cell costing several
# times the intrinsic delay and the area, and the result cascades, because each
# slow weak stage re-violates slew at its own output: the JTAG TCK domain's 258
# loads were reached through 3,259 buffers across 29 levels, about 100x a
# balanced tree at the fanout limit of 10.
#
# Excluding only dlyb_* promoted dlyc_1 and the buffer count went *up*, 64,734
# to 66,240, which is the cascade argument holding rather than failing: a
# slower cell buys more buffers. The whole family has to go.
#
# Nothing in this design uses a delay cell for what it is for. Synthesis emits
# none, ResizerTimingPostCTS removed some rather than adding any, and the 73
# delaynet_*_clk_PAD hold-fix nets are driven by clkbuf_8/clkbuf_16.
EXTRA_EXCLUDED_CELLS:
  - "gf180mcu_fd_sc_mcu7t5v0__dly*"

# Ticket 32: relax the fanout constraint, because its repair is degenerate on
# this design and the constraint is not being met anyway.
#
# At the PDK default of 10, RepairDesignPostGPL spends 17,002 buffers on 2,058
# violating nets, and tracing one shows why that number is so large: the JTAG
# TCK domain's 258 loads are reached through 3,377 buffers whose mean fanout is
# **1.1**. It is not building a tree. It is building 258 private chains of
# single-load buffers, thirteen to eighteen deep, from one strongly-driven pad
# net. Swapping the buffer cell three ways (dlyb_1, dlyc_1, buf_1) left that
# count at 17,002 every time, so the shape comes from the repair, not the cell.
#
# The constraint does not survive the flow either: the same netlist ends with
# max_cap repair buffers carrying fanout 24 to 29, well past 10.
#
# 40 cuts violating nets to 413 while leaving the physically meaningful limits,
# MAX_TRANSITION and MAX_CAPACITANCE above, to do the real work on the genuinely
# wide nets. Those two have working repair: they build real trees.
MAX_FANOUT_CONSTRAINT: 40

# Ticket 29: global routing's "extra iterations to remove overflow" loop
# (LibreLane default 50) restarts from iteration 1 every time it disables NDR
# on a congested net. This design has 73 delaynet_*_clk_PAD nets (hold-fix
# delay-matching buffers on the clock net) that can each trigger a restart, and
# a live 6 MHz run stalled 6+ hours in with only 2/73 cleared at the default of
# 50. Capped to 12 first: measured a striking, exact regularity -- one net
# disabled every 8m12s, every single time, in strict descending net-ID order
# (72, 71, 70, ...), regardless of iteration count within the cycle. That means
# the cap barely changes *which* nets end up NDR-disabled (same order either
# way), only how much time is wasted per cycle before conceding -- so pushed
# lower still. GRT_ALLOW_CONGESTION above already means the router accepts
# finishing with residual congestion instead of erroring, so this is a real
# routing-quality tradeoff on these 73 nets specifically, but a predictable and
# now much cheaper one.
GRT_OVERFLOW_ITERS: 3

# Let the legalizer search a long way. The template raises Y from LibreLane's
# default for a design of two SRAMs and a counter; this one arrives at
# `RepairDesignPostGPL` with a 5,773-load clock net, a 4,257-load reset and four
# more nets over 1,500, none of them buffered (flow/README.md's "no buffering at
# all on its highest-fanout nets"). Repairing them inserts about 61,000 buffers
# and grows standard-cell area by a third in one step, which lands on top of a
# global placement that had already spread to the 35% density target. At 500 x
# 200 um the legalizer could not find room for 425 of the new cells and
# `detailed_placement` failed outright (DPL-0036). The core is only 26% full
# before repair, so the space exists; it is further away than the default search
# will look.
PL_MAX_DISPLACEMENT_X: 1000
PL_MAX_DISPLACEMENT_Y: 1000

# Fix antenna violations after DRT. Ticket 27: OpenROAD's own antenna checker
# converges to 0 net/pin violations at a 10% margin, but the full-chip KLayout
# antenna deck (a stricter, independent model) still found 9 residual ANT.16_i_
# ANT.4 (metal3-perimeter-to-gate-oxide-area) violations against that same
# repaired route -- the same class of gap already found between OpenROAD's and
# KLayout's DRC checkers for the metal3 spacing rule. Raised the margin so
# OpenROAD's repair targets real headroom past its own threshold rather than
# converging exactly to it, since exactly-at-threshold is what let KLayout's
# stricter model disagree.
DRT_ANTENNA_REPAIR_ITERS: 15
DRT_ANTENNA_REPAIR_MARGIN: 25 # %

# Ticket 29: OpenROAD.DetailedRouting was OOM-killed by the host kernel at
# iteration 11 (confirmed via `journalctl -k`, a genuine global OOM, not a
# container cgroup limit -- the openroad process itself held ~5.5 GB RSS at
# the time). Unset, DRT_THREADS defaults to the host's full core count (20
# here); capping it trades wall-clock time for a smaller peak working set,
# since each thread holds its own regional routing state. DRT_SAVE_SNAPSHOTS
# checkpoints the odb after every iteration (disk cost, ~450 GB free locally)
# so a future crash loses at most one iteration instead of the ~13 hours this
# one just did -- iterations 3-11 alone were 47 min to 2h43m each with no
# incremental save.
DRT_THREADS: 8
DRT_SAVE_SNAPSHOTS: true

# Ticket 27's macro-pitch fix (flow/macros.yaml, 301.300 -> 302.300 um between
# SRAM columns) opened a real 1 um gap between abutted macros to clear a metal3
# DRC violation, but a bare 1 um-wide, 515.81 um-tall sliver between two hard
# macros is a routing-congestion trap: global routing "sees" it as available
# capacity and repeatedly tries to thread nets through it, which measured as an
# 80+ minute stall on a step that normally takes about 90 seconds (before the
# fix, the same gap did not exist, so this trap did not either). Blocking every
# routing layer over the 14 gaps (7 columns x 2 rows) makes routing treat them
# exactly as it did when the macros were abutted -- fully non-routable -- while
# the physical air gap that satisfies the DRC rule stays untouched, since this
# only blocks new routed metal, not the macros' own fixed geometry.
ROUTING_OBSTRUCTIONS:
  - ["Metal1", 1061.3, 502.0, 1062.3, 1017.81]
  - ["Metal2", 1061.3, 502.0, 1062.3, 1017.81]
