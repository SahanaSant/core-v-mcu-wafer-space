#
# LibreLane configuration for hardening chip_top. Seeded from
# librelane/config.yaml in the gf180mcu project template (Apache-2.0, (c) 2025
# Project Template Contributors). The template's defaults encode Run 1 and Run
# 2 shuttle experience, so every setting that differs from it carries a reason
# below. Background: docs/reference/flow.md.
#
# `make harden` passes four files, in this order:
#
#   flow/slot_1x1.yaml        die and core geometry, pad ring order
#   flow/macros.yaml          macro views and placement
#   flow/build/sources.yaml   the file list, generated by flow/synth/sources.sh
#   flow/config.yaml          this file
#
# The order matters twice over. Later files win on any key they both set, and
# LibreLane resolves `dir::` against the directory of the *last* file on the
# command line, which is why every one of these lives directly in flow/.

meta:
  version: 3
  flow: Chip
  substituting_steps:

    # Verilator cannot read this design: upstream's RTL is SystemVerilog with
    # interfaces, packages and packed structs across more than fifty files,
    # which is why the front end is yosys-slang. Linting with a front end that
    # cannot elaborate the design would report its own limitations.
    Verilator.Lint: null
    Checker.LintTimingConstructs: null
    Checker.LintErrors: null
    Checker.LintWarnings: null

    # Render the layout after sealring insertion
    KLayout.Render: null
    +KLayout.SealRing: KLayout.Render

DESIGN_NAME: chip_top

# VERILOG_FILES and VERILOG_INCLUDE_DIRS come from flow/build/sources.yaml,
# which flow/synth/sources.sh regenerates from fusesoc on every `make harden`.
# Nothing here should set them; the file list has exactly one source of truth.

# `--keep-hierarchy` is slang's own flag and is unrelated to
# SYNTH_HIERARCHY_MODE, which stays at its "flatten" default: flattening is
# worth 1.30 mm2 of cell area here, not a preference. See
# docs/reference/flow.md.
USE_SLANG: True
SLANG_ARGUMENTS: ['--keep-hierarchy']

# `SYNTHESIS` only disables assertion blocks here. `PULP_FPGA_EMUL` is
# deliberately absent: leaving it undefined is what selects the ASIC branches in
# soc_domain.sv and safe_domain.sv.
VERILOG_DEFINES: ["SYNTHESIS"]

# `dfflibmap` maps flip-flops only, and upstream's apb_soc_ctrl infers two
# latches (`reset_reason[1:0]`). The PDK ships the map and points
# SYNTH_LATCH_MAP at it, but LibreLane's gf180mcu compatibility shim deletes
# that key from the PDK configuration on the way in (config/pdk_compat.py), so
# without this line the netlist carries unmapped `$_DLATCH_P_` cells and
# Checker.YosysUnmappedCells stops the flow.
SYNTH_LATCH_MAP: pdk_dir::libs.tech/librelane/gf180mcu_fd_sc_mcu7t5v0/latch_map.v

# Slightly smaller file sizes
PRIMARY_GDSII_STREAMOUT_TOOL: klayout

# SDC files
PNR_SDC_FILE: dir::chip_top.sdc
SIGNOFF_SDC_FILE: dir::chip_top.sdc
FALLBACK_SDC: dir::chip_top.sdc

# Power / ground nets. One core rail at 3.3 V; the 5.0 V ring is the pads' own
# DVDD/DVSS and never reaches the core grid.
VDD_NETS:
- VDD
GND_NETS:
- VSS

# --- 3.3 V core corner ------------------------------------------------------
#
# The PDK's own libs.tech/librelane/config.tcl defaults to 5.0 V; the core here
# runs at 3.3 V. Three settings have to move together (CELL_LIBS, STA_CORNERS,
# DEFAULT_CORNER) and nothing warns you if one is missed. The library does not
# change: gf180mcu_fd_sc_mcu7t5v0 carries all 229 cells at every one of its
# fifteen corners with identical geometry, so `5v0` is the oxide and this costs
# no area.
#
# Three settings, not four. `VDD_PIN_VOLTAGE` is a *removed* variable in
# LibreLane 3.1 ("Information should be obtained from dotlib files",
# config/removals.py): setting it is accepted and silently discarded, never
# reaching resolved.json. The supply follows from which Liberty files CELL_LIBS
# names. Check resolved.json rather than the config when a corner override
# looks like it did not take.
#
# The library name is written out rather than taken from `--scl`, because
# rtl/gf180mcu/gf180_clk_gate.sv instantiates cells from it by name, which
# makes the override non-functional anyway.
CELL_LIBS:
  "*_tt_025C_3v30":
  - pdk_dir::libs.ref/gf180mcu_fd_sc_mcu7t5v0/lib/gf180mcu_fd_sc_mcu7t5v0__tt_025C_3v30.lib
  "*_ff_n40C_3v60":
  - pdk_dir::libs.ref/gf180mcu_fd_sc_mcu7t5v0/lib/gf180mcu_fd_sc_mcu7t5v0__ff_n40C_3v60.lib
  "*_ss_125C_3v00":
  - pdk_dir::libs.ref/gf180mcu_fd_sc_mcu7t5v0/lib/gf180mcu_fd_sc_mcu7t5v0__ss_125C_3v00.lib

STA_CORNERS:
- nom_tt_025C_3v30
- nom_ss_125C_3v00
- nom_ff_n40C_3v60
- min_tt_025C_3v30
- min_ss_125C_3v00
- min_ff_n40C_3v60
- max_tt_025C_3v30
- max_ss_125C_3v00
- max_ff_n40C_3v60

DEFAULT_CORNER: nom_tt_025C_3v30

# The pad ring is not this rail: it runs at 5.0 V, level-shifted inside each
# `gf180mcu_ocd_io` cell. The PDK's pad configuration maps these 3.3 V corner
# names onto the pad library's 3v30/3v63/2v97 files, so the pads are
# characterised at the core supply rather than the 5.0 V they will run at. That
# is pessimistic on the output driver and is left that way on purpose.

# --- Clock ------------------------------------------------------------------
#
# 200 ns / 5 MHz. Three measured post-route STA results at ss_125C_3v00, not
# estimates:
#
#   100 ns     WNS -28.59 ns   9,127 violations
#   166.67 ns  WNS  -7.72 ns     162 violations
#   200 ns     WNS +25.61 ns       0 violations
#
# Every violation at 166.67 ns launches from one flop, `instr_rdata_i[17]` in
# the CV32E40P decoder, fanning out to 162 endpoints across the die into the
# AXI crossbar arbiter: 176 stages, 169.6 ns of data path, split almost exactly
# half between real logic and resizer repair buffers. It is structural, and
# closing it at 6 MHz would mean pipelining the decode-to-interconnect request
# path, which is new microarchitecture. Full story:
# docs/explanation/timing.md.
#
# The clock is external, so the frequency is a crystal choice on the bring-up
# board rather than anything burned into silicon. 5 MHz also divides cleanly:
# 200 ns exactly, where 6 MHz left the cocotb driver truncating 166.67 to 166.
#
# Four things track this number and must change with it: sw/bootrom/spi.c's
# PERIPH_CLK_HZ, sw/app/uart.c's PERIPH_CLK_HZ, sim/cocotb/tb_top_tb.py's
# CLK_HZ, and sim/tb/tb_top.sv's CLKS_PER_BIT (the integer
# PERIPH_CLK_HZ/115200 the UART divider lands on, 43 at 5 MHz).
#
# The clock is defined on the pad cell's core-side output rather than the bond
# pad. The JTAG clock is declared in flow/chip_top.sdc, which this cannot
# express.
CLOCK_PORT: clk_PAD
CLOCK_NET: clk_pad/Y
CLOCK_PERIOD: 200

# --- Placement and routing --------------------------------------------------

# Overfix hold, because 180 nm hold fixing is cheap and a hold failure is not
# repairable after fabrication. 0.35 is the template's value and it stays.
#
# **1.0 was tried here and made hold dramatically worse. Do not raise this
# without reading why.** At 1.0 the post-CTS resizer found 14,640 violating
# endpoints and inserted 33,152 hold buffers, against 1,394 and 1,333 at 0.35.
# Post-route at ss_125C_3v00 that moved hold WNS from -0.359 ns to -9.616 ns
# and ate nearly the whole setup margin the 200 ns period had just bought
# (+25.6 -> +0.67). The added buffers sit in data paths, and the placement
# churn needed to fit them moved clock sinks: the surviving violations are not
# short paths but paths with ~18 ns of skew between the main tree and the uDMA
# sub-trees. No amount of data-path delay fixes a skew problem.
#
# The residual is repaired at the right stage instead, after global routing.
# See RUN_POST_GRT_RESIZER_TIMING below and docs/explanation/timing.md.
PL_RESIZER_HOLD_SLACK_MARGIN: 0.35

# Turn the post-global-routing resizer on, which the Chip flow leaves off.
#
# By default there is no ResizerTimingPostGRT step at all, so hold is repaired
# exactly once in ResizerTimingPostCTS, against *estimated* parasitics, with
# nothing revisiting it after RCX extracts the real ones. That gap is the
# entire hold problem here: a design fixed to +0.35 ns post-CTS came out of
# routing with 88 violations at up to -0.359 ns.
#
# Repairing after global routing is the targeted version of what raising
# PL_RESIZER_HOLD_SLACK_MARGIN tried to do bluntly. Parasitics are close to
# final, so the repair lands on the paths actually violating and the
# perturbation is correspondingly smaller.
#
# The setup half of the step is nearly a no-op at 200 ns
# (GRT_RESIZER_SETUP_SLACK_MARGIN is 0.025 against tens of nanoseconds of
# slack), and GRT_RESIZER_ALLOW_SETUP_VIOS is False, so hold repair cannot
# trade setup away to do its job.
RUN_POST_GRT_RESIZER_TIMING: true

# 0.3 undershot: turning the step on took reg-to-reg hold violations from 57
# to 19 while inserting a single buffer, so the aim was right and the margin
# too small to reach the rest. The violations left over are all inside
# 0.204 ns, which 0.6 covers with room to spare.
#
# This is not the post-CTS blowup in a new place. That one repaired 14,640
# endpoints against estimated parasitics before CTS had settled; this step
# runs after global routing on a placed and clocked design, and at 0.3 it
# touched one endpoint.
GRT_RESIZER_HOLD_SLACK_MARGIN: 0.6

# Run 1 designs achieved 3k to 14k cells/mm2 against a much higher theoretical
# maximum, so 35% is the optimistic end of that experience. There is room:
# 2.33 mm2 of cells in roughly 10.4 mm2 of placeable core is about 22% actual
# utilisation, so this is a ceiling the placer spreads under rather than a
# target it has to reach.
PL_TARGET_DENSITY_PCT: 35
GRT_ALLOW_CONGESTION: true

# Keep the delay cells away from the resizer. Every one of
# RepairDesignPostGPL's 16,518 max-fanout repair buffers was a delay cell, one
# whose purpose is adding delay, while wire-length and slew repair picked
# sensible buf/clkbuf sizes. OpenROAD's fanout repair takes the library's
# lowest-drive buffer, and this library puts all four delay families at or
# above buf_1 on drive resistance off the tt_025C_3v30 arcs:
#
#   dlyc_1  13.53 ns/pF   2.284 ns intrinsic   area 54.88
#   dlyd_1  13.53         3.299                     74.64
#   dlyb_1  13.52         1.229                     35.12
#   dlya_1  13.48         0.528                     24.15
#   buf_1   13.48         0.210                     13.17
#
# So a fraction of a percent in drive resistance selects a cell costing several
# times the intrinsic delay and the area, and the result cascades, because each
# slow weak stage re-violates slew at its own output: the JTAG TCK domain's 258
# loads were reached through 3,259 buffers across 29 levels, about 100x a
# balanced tree at the fanout limit of 10.
#
# Excluding only dlyb_* promoted dlyc_1 and the buffer count went *up*, 64,734
# to 66,240, which is the cascade argument holding rather than failing: a
# slower cell buys more buffers. The whole family has to go.
#
# Nothing in this design uses a delay cell for what it is for. Synthesis emits
# none, ResizerTimingPostCTS removed some rather than adding any, and the 73
# delaynet_*_clk_PAD hold-fix nets are driven by clkbuf_8/clkbuf_16.
EXTRA_EXCLUDED_CELLS:
  - "gf180mcu_fd_sc_mcu7t5v0__dly*"

# Relax the fanout constraint, because its repair is degenerate on this design
# and the constraint is not being met anyway.
#
# At the PDK default of 10, RepairDesignPostGPL spends 17,002 buffers on 2,058
# violating nets, and tracing one shows why that number is so large: the JTAG
# TCK domain's 258 loads are reached through 3,377 buffers whose mean fanout is
# **1.1**. It is not building a tree. It is building 258 private chains of
# single-load buffers, thirteen to eighteen deep, from one strongly-driven pad
# net. Swapping the buffer cell three ways (dlyb_1, dlyc_1, buf_1) left that
# count at 17,002 every time, so the shape comes from the repair, not the cell.
#
# The constraint does not survive the flow either: the same netlist ends with
# max_cap repair buffers carrying fanout 24 to 29, well past 10.
#
# 40 cuts violating nets to 413 while leaving the physically meaningful limits,
# MAX_TRANSITION and MAX_CAPACITANCE above, to do the real work on the genuinely
# wide nets. Those two have working repair: they build real trees.
MAX_FANOUT_CONSTRAINT: 40

# Global routing's "extra iterations to remove overflow" loop (LibreLane
# default 50) restarts from iteration 1 every time it disables NDR on a
# congested net. This design has 73 delaynet_*_clk_PAD nets that can each
# trigger a restart, and a run stalled 6+ hours in with only 2 of 73 cleared at
# the default.
#
# The cap does not change *which* nets end up NDR-disabled, only how long the
# router grinds before conceding on each: at 12 it disabled one net every 8m12s
# exactly, in strict descending net-ID order, and at 3 the same order in about
# 25s. GRT_ALLOW_CONGESTION above already accepts residual congestion, so this
# is a real routing-quality tradeoff on those 73 nets, and a predictable one.
GRT_OVERFLOW_ITERS: 3

# Let the legalizer search a long way. The template raises Y from LibreLane's
# default for a design of two SRAMs and a counter; this one arrives at
# `RepairDesignPostGPL` with a 5,773-load clock net, a 4,257-load reset and four
# more nets over 1,500, none of them buffered. Repairing them inserts about
# 61,000 buffers
# and grows standard-cell area by a third in one step, which lands on top of a
# global placement that had already spread to the 35% density target. At 500 x
# 200 um the legalizer could not find room for 425 of the new cells and
# `detailed_placement` failed outright (DPL-0036). The core is only 26% full
# before repair, so the space exists; it is further away than the default search
# will look.
PL_MAX_DISPLACEMENT_X: 1000
PL_MAX_DISPLACEMENT_Y: 1000

# Fix antenna violations after detailed routing. OpenROAD's own checker
# converges to zero at a 10% margin, but KLayout's stricter, independent
# antenna deck still found 9 residual ANT.16_i_ANT.4 violations against that
# same route. Converging exactly to OpenROAD's threshold is what leaves room
# for the stricter model to disagree, so the margin targets real headroom past
# it.
DRT_ANTENNA_REPAIR_ITERS: 15
DRT_ANTENNA_REPAIR_MARGIN: 25 # %

# Detailed routing was OOM-killed by the host kernel at iteration 11, holding
# ~5.5 GB RSS. Unset, DRT_THREADS defaults to the host's full core count;
# capping it trades wall-clock time for a smaller peak working set, since each
# thread holds its own regional routing state. DRT_SAVE_SNAPSHOTS checkpoints
# the odb after every iteration, so a crash loses one iteration rather than the
# ~13 hours this one did (iterations 3-11 were 47 min to 2h43m each).
DRT_THREADS: 8
DRT_SAVE_SNAPSHOTS: true

# The 1 um gap flow/macros.yaml opens between SRAM columns clears a metal3 DRC
# violation, but a bare 1 um-wide, 515.81 um-tall sliver between two hard
# macros is a routing-congestion trap: global routing sees it as available
# capacity and keeps trying to thread nets through it, which measured as an
# 80+ minute stall on a step that normally takes about 90 seconds.
#
# Blocking the 14 gaps (7 columns x 2 rows) makes routing treat them as it did
# when the macros abutted. This blocks new routed metal only; the physical air
# gap that satisfies the DRC rule is untouched.
#
# Metal1 to Metal3 only, not all five. The macro carries no Metal4 or Metal5 in
# LEF or GDS, so those layers have no neighbouring geometry to be spaced
# against and route freely over the macro body. Blocking them too cost real
# violations: 107 shorts, every one a net against these obstructions, 80 on
# Metal4 and 27 on Metal5.
ROUTING_OBSTRUCTIONS:
  - ["Metal1", 1061.3, 502.0, 1062.3, 1017.81]
  - ["Metal2", 1061.3, 502.0, 1062.3, 1017.81]
  - ["Metal3", 1061.3, 502.0, 1062.3, 1017.81]
  - ["Metal1", 1363.6, 502.0, 1364.6, 1017.81]
