  - ["Metal3", 1363.6, 502.0, 1364.6, 1017.81]
  - ["Metal1", 1665.9, 502.0, 1666.9, 1017.81]
  - ["Metal2", 1665.9, 502.0, 1666.9, 1017.81]
  - ["Metal3", 1665.9, 502.0, 1666.9, 1017.81]
  - ["Metal1", 1968.2, 502.0, 1969.2, 1017.81]
  - ["Metal2", 1968.2, 502.0, 1969.2, 1017.81]
  - ["Metal3", 1968.2, 502.0, 1969.2, 1017.81]
  - ["Metal1", 2270.5, 502.0, 2271.5, 1017.81]
