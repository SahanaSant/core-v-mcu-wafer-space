#
# Macro views and placement. Seeded from librelane/macros/macros_3v3.yaml in the
# gf180mcu project template (Apache-2.0, (c) 2025 Project Template Contributors).
# The five wafer.space marker cells and their die-corner coordinates are the
# template's, unchanged. The SRAM section is this design's.
#
# The template folds instance placement into the macro definition rather than
# using a separate macro_placement.cfg, and that is what the LibreLane in this
# container reads: `Odb.ManualMacroPlacement` takes both, but the `instances`
# key is the one the Chip flow's own template exercises. flow/README.md's table
# still lists a `macro_placement.cfg`; there isn't one, and this is why.
#
# --- The macro array (tickets 11, 21, 25) -----------------------------------
#
# Sixteen gf180mcu_ocd_ip_sram__sram1024x8m8wm1, 301.300 x 515.810 um each, in
# the 2 rows x 8 columns ticket 21 settled, along the south edge of the
# 442..3490 x 442..4680 core. Coordinates are computed from the LEF `SIZE` and
# the core area rather than carried over from ticket 11's 4x4 planning
# arithmetic, which ticket 21 superseded.
#
#   columns   760.00 + n * 301.300, n = 0..7, abutted.
#             2410.40 um of macro in 3048 um of core, centred, leaving 318.00 um
#             on the left and 319.60 um on the right for standard cells beside
#             the array. The macros abut because every signal pin is on the
#             short edge, so no vertical channel buys anything; the LEF leaves a
#             3 um frame free of Metal1 to Metal3 on each side, so abutted
#             neighbours still present a 6 um gap on those layers.
#   row 0     y = 502.00, private banks 0 and 1, four byte lanes each.
#   row 1     y = 1118.00, interleaved channels 0 and 1, four byte lanes each.
#
# Both rows are **FS**, not the template's N. All 37 signal pins sit on Metal2
# in a 3 um band along one edge of the macro, so orientation decides which way
# the interface faces, and FS turns it upwards: row 1's pins then face the
# standard-cell region directly with no channel needed above the array at all,
# and row 0's face the 100.19 um channel between the two rows. Placing both rows
# N would have put row 0's whole interface against the core's south boundary,
# where the only escape is back over the array.
#
# Row order is ticket 21's: private banks (instruction fetch, through the
# contiguous crossbar) in one row, interleaved channels (data and uDMA, through
# the interleaved crossbar) in the other, so that the independence ticket 11's
# firmware story assumes survives as a row-level split. The interleaved pair
# takes the upper row, nearer the logic, because it carries both of the busier
# masters.

MACROS:
