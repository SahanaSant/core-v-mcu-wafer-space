        location: [26, "expr::$DIE_AREA[3] - 169.25"]
        orientation: N

  gf180mcu_ocd_ip_sram__sram1024x8m8wm1:
    gds:
      - pdk_dir::libs.ref/gf180mcu_ocd_ip_sram/gds/gf180mcu_ocd_ip_sram__sram1024x8m8wm1.gds
    lef:
      - pdk_dir::libs.ref/gf180mcu_ocd_ip_sram/lef/gf180mcu_ocd_ip_sram__sram1024x8m8wm1.lef
    vh:
      - pdk_dir::libs.ref/gf180mcu_ocd_ip_sram/verilog/gf180mcu_ocd_ip_sram__sram1024x8m8wm1__blackbox_pp.v
    # Ticket 20 patched this liberty's `area` and `memory() { address_width }`
    # to the real macro's values; its timing is still the foundry 512x8's, read
    # as a deliberate pessimistic proxy, not as a stopgap.
    lib:
      "*_tt_025C_3v30":
        - pdk_dir::libs.ref/gf180mcu_ocd_ip_sram/lib/gf180mcu_ocd_ip_sram__sram1024x8m8wm1__tt_025C_3v30.lib
      "*_ff_n40C_3v60":
        - pdk_dir::libs.ref/gf180mcu_ocd_ip_sram/lib/gf180mcu_ocd_ip_sram__sram1024x8m8wm1__ff_n40C_3v60.lib
      "*_ss_125C_3v00":
        - pdk_dir::libs.ref/gf180mcu_ocd_ip_sram/lib/gf180mcu_ocd_ip_sram__sram1024x8m8wm1__ss_125C_3v00.lib
    instances:
      # Row 0, y = 502.00: private bank 0, then private bank 1.
      i_chip_core.i_core_v_mcu.i_soc_domain.l2_ram_i.bank_sram_pri0_i.i_bank.gen_byte_lane[0].i_sram:
        location: [760.00, 502.00]
        orientation: FS
      i_chip_core.i_core_v_mcu.i_soc_domain.l2_ram_i.bank_sram_pri0_i.i_bank.gen_byte_lane[1].i_sram:
        location: [1061.30, 502.00]
        orientation: FS
      i_chip_core.i_core_v_mcu.i_soc_domain.l2_ram_i.bank_sram_pri0_i.i_bank.gen_byte_lane[2].i_sram:
        location: [1362.60, 502.00]
        orientation: FS
      i_chip_core.i_core_v_mcu.i_soc_domain.l2_ram_i.bank_sram_pri0_i.i_bank.gen_byte_lane[3].i_sram:
        location: [1663.90, 502.00]
        orientation: FS
      i_chip_core.i_core_v_mcu.i_soc_domain.l2_ram_i.bank_sram_pri1_i.i_bank.gen_byte_lane[0].i_sram:
        location: [1965.20, 502.00]
        orientation: FS
      i_chip_core.i_core_v_mcu.i_soc_domain.l2_ram_i.bank_sram_pri1_i.i_bank.gen_byte_lane[1].i_sram:
        location: [2266.50, 502.00]
        orientation: FS
      i_chip_core.i_core_v_mcu.i_soc_domain.l2_ram_i.bank_sram_pri1_i.i_bank.gen_byte_lane[2].i_sram:
        location: [2567.80, 502.00]
        orientation: FS
      i_chip_core.i_core_v_mcu.i_soc_domain.l2_ram_i.bank_sram_pri1_i.i_bank.gen_byte_lane[3].i_sram:
        location: [2869.10, 502.00]
        orientation: FS

      # Row 1, y = 1118.00: interleaved channel 0, then interleaved channel 1.
      i_chip_core.i_core_v_mcu.i_soc_domain.l2_ram_i.CUTS[0].bank_i.i_bank.gen_byte_lane[0].i_sram:
        location: [760.00, 1118.00]
        orientation: FS
      i_chip_core.i_core_v_mcu.i_soc_domain.l2_ram_i.CUTS[0].bank_i.i_bank.gen_byte_lane[1].i_sram:
        location: [1061.30, 1118.00]
        orientation: FS
      i_chip_core.i_core_v_mcu.i_soc_domain.l2_ram_i.CUTS[0].bank_i.i_bank.gen_byte_lane[2].i_sram:
        location: [1362.60, 1118.00]
        orientation: FS
      i_chip_core.i_core_v_mcu.i_soc_domain.l2_ram_i.CUTS[0].bank_i.i_bank.gen_byte_lane[3].i_sram:
        location: [1663.90, 1118.00]
        orientation: FS
      i_chip_core.i_core_v_mcu.i_soc_domain.l2_ram_i.CUTS[1].bank_i.i_bank.gen_byte_lane[0].i_sram:
        location: [1965.20, 1118.00]
        orientation: FS
      i_chip_core.i_core_v_mcu.i_soc_domain.l2_ram_i.CUTS[1].bank_i.i_bank.gen_byte_lane[1].i_sram:
        location: [2266.50, 1118.00]
        orientation: FS
      i_chip_core.i_core_v_mcu.i_soc_domain.l2_ram_i.CUTS[1].bank_i.i_bank.gen_byte_lane[2].i_sram:
        location: [2567.80, 1118.00]
        orientation: FS
      i_chip_core.i_core_v_mcu.i_soc_domain.l2_ram_i.CUTS[1].bank_i.i_bank.gen_byte_lane[3].i_sram:
        location: [2869.10, 1118.00]
        orientation: FS

# The macros carry no power ports in the RTL (rtl/gf180mcu/gf180_l2_ram.sv
# instantiates the signal pins alone), so the connection to the core rail is
# made here instead. One regular expression covers all sixteen; the core is a
# single 3.3 V rail (tickets 14, 21), so there is only one pair of nets to name.
PDN_MACRO_CONNECTIONS:
- "i_chip_core\\.i_core_v_mcu\\.i_soc_domain\\.l2_ram_i\\..*\\.i_sram VDD VSS VDD VSS"
