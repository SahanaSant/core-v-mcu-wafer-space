#
# Macro views and placement. Seeded from librelane/macros/macros_3v3.yaml in the
# gf180mcu project template (Apache-2.0, (c) 2025 Project Template Contributors).
# The five wafer.space marker cells and their die-corner coordinates are the
# template's, unchanged. The SRAM section is this design's.
#
# The template folds instance placement into the macro definition rather than
# using a separate macro_placement.cfg, and that is what
# `Odb.ManualMacroPlacement` reads here.
#
# --- The macro array --------------------------------------------------------
#
# Sixteen gf180mcu_ocd_ip_sram__sram1024x8m8wm1, 301.300 x 515.810 um each, in
# 2 rows x 8 columns along the south edge of the 442..3490 x 442..4680 core.
# Coordinates are computed from LEF `SIZE` and the core area.
#
#   columns   760.00 + n * 302.300, n = 0..7, a real 1 um gap between
#             neighbours. 2417.40 um of macro in 3048 um of core, leaving
#             318.00 um on the left and 312.60 um on the right for standard
#             cells beside the array.
#   row 0     y = 502.00, private banks 0 and 1, four byte lanes each.
#   row 1     y = 1118.00, interleaved channels 0 and 1, four byte lanes each.
#
# The macros do **not** abut, and that gap is not decoration. Full-chip KLayout
# DRC found 197 real M3.2a/M3.2b violations, all at the seven column
# boundaries: the LEF declares a 3 um frame free of Metal1 to Metal3 on each
# edge, and the real GDS contradicts it, running Metal3 flush to the true macro
# boundary on all four sides. Abutting at the bare 301.300 pitch put two
# macros' Metal3 within 2-10 nm. 1 um clears the 0.28/0.3 um rule against every
# measured gap. flow/config.yaml blocks routing over the resulting slivers.
#
# Both rows are **FS**, not the template's N. All 37 signal pins sit on Metal2
# in a 3 um band along one edge, so orientation decides which way the interface
# faces, and FS turns it upwards: row 1's pins face the standard-cell region
# directly with no channel needed above the array, and row 0's face the
# 100.19 um channel between the rows. Placing both rows N would have put row 0's
# whole interface against the core's south boundary, where the only escape is
# back over the array.
#
# Row order keeps the private banks (instruction fetch, contiguous crossbar)
# and the interleaved channels (data and uDMA, interleaved crossbar) in
# separate rows, so the independence the firmware assumes survives as a
# row-level split. The interleaved pair takes the upper row, nearer the logic,
# because it carries both of the busier masters.

MACROS:
  # required: will be replaced with actual content
  gf180mcu_ws_ip__qrcode_id:
    gds:
      - dir::../ip/gf180mcu_ws_ip__qrcode_id/gds/gf180mcu_ws_ip__qrcode_id.gds
    lef:
      - dir::../ip/gf180mcu_ws_ip__qrcode_id/lef/gf180mcu_ws_ip__qrcode_id.lef
    vh:
      - dir::../ip/gf180mcu_ws_ip__qrcode_id/vh/gf180mcu_ws_ip__qrcode_id.v
    lib:
      "*":
        - dir::../ip/gf180mcu_ws_ip__qrcode_id/lib/gf180mcu_ws_ip__qrcode_id.lib
    instances:
      qrcode_id:
        location: [26, 26]
        orientation: N

  # required: will be replaced with actual content
  gf180mcu_ws_ip__shuttle_id:
